<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Portrait review</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #16161a;
        --panel: #222228;
        --text: #ececf1;
        --muted: #a0a0ab;
        --keep: #3f9c5a;
        --repaint: #c4553e;
        --accent: #6c8cd5;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font:
          15px/1.4 system-ui,
          sans-serif;
        display: flex;
        flex-direction: column;
        height: 100vh;
      }
      header {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        align-items: center;
        padding: 10px 16px;
        background: var(--panel);
      }
      header h1 {
        font-size: 16px;
        margin: 0 8px 0 0;
      }
      .counts {
        color: var(--muted);
      }
      select,
      button {
        font: inherit;
        color: var(--text);
        background: #33333b;
        border: 1px solid #44444d;
        border-radius: 6px;
        padding: 6px 12px;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.4;
        cursor: default;
      }
      main {
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 12px 16px;
        gap: 10px;
      }
      .frame {
        flex: 1;
        min-height: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
      }
      .frame img {
        max-height: 100%;
        max-width: 100%;
        border-radius: 8px;
      }
      .frame img.trashed {
        opacity: 0.35;
        filter: grayscale(1);
      }
      .empty {
        color: var(--muted);
        font-size: 18px;
      }
      .name {
        font-size: 20px;
        font-weight: 600;
      }
      .status {
        color: var(--muted);
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        justify-content: center;
      }
      .actions button {
        padding: 10px 20px;
      }
      .keep {
        background: var(--keep);
        border-color: var(--keep);
      }
      .repaint {
        background: var(--repaint);
        border-color: var(--repaint);
      }
      kbd {
        font-size: 12px;
        opacity: 0.75;
        margin-left: 6px;
      }
      .strip {
        display: flex;
        gap: 4px;
        overflow-x: auto;
        width: 100%;
        padding: 6px 16px 12px;
      }
      .strip button {
        flex: none;
        width: 52px;
        height: 52px;
        padding: 0;
        overflow: hidden;
        border-width: 2px;
      }
      .strip img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .strip .trashed {
        border-color: var(--repaint);
      }
      .strip .trashed img {
        opacity: 0.35;
      }
      .strip .missing {
        border-style: dashed;
      }
      .strip .current {
        border-color: var(--accent);
        outline: 2px solid var(--accent);
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Portrait review</h1>
      <label>
        Show
        <select id="filter">
          <option value="present">Kept</option>
          <option value="trashed">To repaint</option>
          <option value="missing">Missing</option>
          <option value="all">All</option>
        </select>
      </label>
      <label>
        Format
        <select id="format">
          <option value="">Any</option>
          <option value="png">.png</option>
          <option value="webp">.webp</option>
          <option value="jpg">.jpg</option>
        </select>
      </label>
      <span class="counts" id="counts"></span>
    </header>
    <main>
      <div class="frame" id="frame"></div>
      <div class="name" id="name"></div>
      <div class="status" id="status"></div>
      <div class="actions">
        <button id="prev">← Previous</button>
        <button id="keep" class="keep">Keep<kbd>K</kbd></button>
        <button id="repaint" class="repaint">Repaint<kbd>R</kbd></button>
        <button id="restore">Restore<kbd>U</kbd></button>
        <button id="next">Next →</button>
      </div>
    </main>
    <nav class="strip" id="strip"></nav>
    <script>
      const $ = (id) => document.getElementById(id);
      let portraits = [];
      let index = 0;
      // The stem shown, kept when the list changes under it.
      let currentStem = null;

      const extension = (p) => p.file?.split('.').pop() ?? '';
      const visible = () =>
        portraits.filter(
          (p) =>
            ($('filter').value === 'all' || p.status === $('filter').value) &&
            (!$('format').value || extension(p) === $('format').value),
        );
      const label = (p) =>
        `${p.race} ${p.characterClass}, ${p.variant.replace('1', '')}`;
      const imageUrl = (p) => `/image/${p.file}?v=${p.status}`;

      const render = () => {
        const shown = visible();
        const byStatus = (s) => portraits.filter((p) => p.status === s).length;
        $('counts').textContent =
          `${byStatus('present')} kept · ${byStatus('trashed')} to repaint · ${byStatus('missing')} missing`;
        if (currentStem) {
          const at = shown.findIndex((p) => p.stem === currentStem);
          if (at >= 0) index = at;
        }
        index = Math.max(0, Math.min(index, shown.length - 1));
        const p = shown[index];
        currentStem = p?.stem ?? null;

        $('frame').replaceChildren();
        if (!p) {
          $('frame').innerHTML = '<div class="empty">Nothing to show.</div>';
        } else if (p.file) {
          const img = document.createElement('img');
          img.src = imageUrl(p);
          img.alt = label(p);
          img.className = p.status;
          $('frame').append(img);
        } else {
          $('frame').innerHTML =
            '<div class="empty">No image: npm run portraits:paint will paint it.</div>';
        }
        $('name').textContent = p ? label(p) : '';
        $('status').textContent = p
          ? `${index + 1} / ${shown.length} · ${p.file ?? p.stem} · ${
              { present: 'kept', trashed: 'to repaint', missing: 'missing' }[
                p.status
              ]
            }`
          : '';
        $('prev').disabled = index <= 0;
        $('next').disabled = index >= shown.length - 1;
        $('keep').disabled = !p || p.status === 'missing';
        $('repaint').disabled = p?.status !== 'present';
        $('restore').disabled = p?.status !== 'trashed';

        $('strip').replaceChildren(
          ...shown.map((q, i) => {
            const b = document.createElement('button');
            b.title = label(q);
            b.className = `${q.status}${i === index ? ' current' : ''}`;
            if (q.file) {
              const img = document.createElement('img');
              img.src = imageUrl(q);
              img.alt = '';
              img.loading = 'lazy';
              b.append(img);
            }
            b.onclick = () => go(i);
            return b;
          }),
        );
        $('strip').querySelector('.current')?.scrollIntoView({
          block: 'nearest',
          inline: 'center',
        });
      };

      const go = (i) => {
        const shown = visible();
        if (i < 0 || i >= shown.length) return;
        index = i;
        currentStem = shown[i].stem;
        render();
      };

      /** Moves on to the next portrait of the filter (the current one may leave it). */
      const advance = () => {
        const shown = visible();
        currentStem = shown[index + 1]?.stem ?? shown[index - 1]?.stem ?? null;
      };

      const act = async (action) => {
        const p = visible()[index];
        if (!p) return;
        advance();
        const res = await fetch(
          `/api/${action}?stem=${encodeURIComponent(p.stem)}`,
          { method: 'POST' },
        );
        portraits = await res.json();
        render();
      };

      const keep = () => {
        const p = visible()[index];
        if (p?.status === 'trashed') return act('restore');
        go(index + 1);
      };

      $('prev').onclick = () => go(index - 1);
      $('next').onclick = () => go(index + 1);
      $('keep').onclick = keep;
      $('repaint').onclick = () => act('reject');
      $('restore').onclick = () => act('restore');
      $('filter').onchange = $('format').onchange = () => {
        index = 0;
        currentStem = null;
        render();
      };
      document.addEventListener('keydown', (e) => {
        if (e.target instanceof HTMLSelectElement) return;
        const key = e.key.toLowerCase();
        if (key === 'arrowleft') go(index - 1);
        else if (key === 'arrowright') go(index + 1);
        else if (key === 'k') keep();
        else if (key === 'r' && visible()[index]?.status === 'present')
          act('reject');
        else if (key === 'u' && visible()[index]?.status === 'trashed')
          act('restore');
      });

      fetch('/api/portraits')
        .then((res) => res.json())
        .then((list) => {
          portraits = list;
          render();
        });
    </script>
  </body>
</html>
